# Two tiers.
#
#   quick   runs on every push and pull request. Linux only. This is where the portability
#           answers actually live: the C back-end is developed on macOS against homebrew's
#           libomp, and the question that matters is whether it still builds where
#           SHLIB_OPENMP_CFLAGS is supplied by the toolchain instead.
#   matrix  the CRAN-like matrix across three R versions and three platforms. Runs on every
#           push to main, on a weekly schedule, and on demand.
#
# *** WHY THE MATRIX IS NO LONGER DISPATCH-ONLY, 31 Aug 2026. It used to carry
# `if: github.event_name == 'workflow_dispatch'`, on the reasoning that these repositories were
# private and Actions minutes metered. THE REPOSITORY IS PUBLIC, so minutes are free, and the
# saving was buying nothing. What it cost was real: on 31 August a CRAN resubmission reached the
# confirmation step, which asks the maintainer to declare that the package was checked on a
# current r-devel, and r-devel had never run on the code -- every push had silently exercised
# only the quick ubuntu-release job. A saving that produces an untrue declaration is not a
# saving. The weekly schedule is there for a second reason: r-devel moves, and a package that
# passes today can fail in a month without a single commit. ***
#
# The package lives in a subdirectory of this repository (the repo root holds the R package,
# the Python package and the parity harnesses side by side), hence working-directory below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 05:00 UTC. Catches r-devel drift on a package nobody has touched.
    - cron: '0 5 * * 1'

name: R-CMD-check

permissions: read-all

jobs:
  quick:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: ubuntu-latest (release)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          working-directory: arcstat
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: arcstat
          upload-snapshots: true

  # The Python front carries its OWN copy of the shared C, so it can drift from the R copy
  # silently. This job checks the Python package on its own terms; parity_sync_guard.sh in the
  # parity harnesses is what catches drift between the two copies.
  python:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: python (both fronts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run the arcstat identity tests
        working-directory: arcstat-py
        run: python -m pytest tests -q
      - name: Run the ellstat identity tests
        working-directory: ellstat-py
        run: python -m pytest tests -q

  # Cross-front agreement. The harnesses need BOTH fronts, so this job installs R as well; it
  # proves the two fronts return byte-identical values from the shared C, which neither the R
  # tests nor the Python tests can show on their own.
  parity:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: parity (R vs Python)
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The harnesses call library(arcstat) on the R side, so the package has to be INSTALLED,
      # not merely checked out. CI found this on 21 Aug 2026: "there is no package called
      # 'arcstat'". The Python front needs no install step -- it compiles its own library on
      # first import, which is what the sync guard's rebuild note refers to.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: arcstat
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ellstat
      - name: Install the R packages
        run: |
          R CMD INSTALL arcstat
          R CMD INSTALL ellstat
      - name: Run every parity harness
        run: |
          set -e
          for h in parity_arccirc.sh parity_eq2.sh parity_eqfit.sh parity_k4.sh parity_mv.sh parity_vc.sh parity_batch.sh; do
            echo "=== $h"
            sh "$h" arcstat arcstat-py
          done
          echo "=== parity_ellstat.sh"
          sh parity_ellstat.sh

  matrix:
    # everything except pull requests, where `quick` is the fast gate
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          working-directory: arcstat
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: arcstat
          upload-snapshots: true
